# docker-compose.prod.yml — PRODUCTION
#
# Usage:
#   Copy .env.example → .env, fill in all values, then:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Features:
#   - No source volume mounts — images are self-contained
#   - Postgres port NOT exposed externally
#   - No hot reload
#   - restart: unless-stopped on all services

version: "3.9"

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No ports — only reachable by other services on the internal Docker network
    volumes:
      - cinetrace_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No ports — internal only
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"     # Bind to localhost only — Caddy proxies externally
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Run migrations then start gunicorn.
    command: >
      sh -c "alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_URL: http://backend:8000
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"     # Bind to localhost only — Caddy proxies externally
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TWITTER_API_KEY: ${TWITTER_API_KEY}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN}
      TWITTER_ACCESS_TOKEN_SECRET: ${TWITTER_ACCESS_TOKEN_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Insight Engine: DB-driven discovery → ranking → dedup → LLM copywriting.
      # Overridable from the host .env; defaults on. Set to "false" to fall back
      # to the legacy generator/scorer broadcaster path (instant rollback).
      INSIGHT_ENGINE_ENABLED: ${INSIGHT_ENGINE_ENABLED:-true}
      # Reactive layer (filtered stream + reactive replies + trends + reddit).
      # Default OFF: the filtered stream continuously consumes the metered X
      # Posts cap, so keeping it off means X API credits are spent only on
      # scheduled tweeting. Set to "true" in the host .env to re-enable.
      REACTIVE_ENABLED: ${REACTIVE_ENABLED:-false}
      BOT_TWITTER_HANDLE: ${BOT_TWITTER_HANDLE}
      CINETRACE_BASE_URL: ${CINETRACE_BASE_URL}
      CINETRACE_SCREENSHOT_URL: ${CINETRACE_SCREENSHOT_URL:-http://frontend:3000}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  cinetrace_postgres_data_prod:
    external: true
